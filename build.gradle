plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "argon" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

configurations {
    irisCompatibilityProbe
}

def shaderDevStackEnabled = providers.gradleProperty("argon_dev_shader_stack")
    .map { it.toBoolean() }
    .orElse(false)

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    if (providers.gradleProperty("iris_probe_version").isPresent()) {
        irisCompatibilityProbe "maven.modrinth:iris:${providers.gradleProperty("iris_probe_version").get()}"
    }

    if (shaderDevStackEnabled.get()) {
        localRuntime "net.fabricmc.fabric-api:fabric-api:${project.dev_fabric_api_version}"
        localRuntime "maven.modrinth:sodium:${project.dev_sodium_version}"
        localRuntime "maven.modrinth:iris:${project.dev_iris_version}"
    }
}

tasks.register("resolveIrisCompatibilityProbe", Copy) {
    onlyIf {
        providers.gradleProperty("iris_probe_version").isPresent()
    }

    from configurations.irisCompatibilityProbe
    into layout.buildDirectory.dir("compatibility/iris")
    rename { "iris-probe.jar" }
}

tasks.register("prepareSpooklementaryBenchmark") {
    group = "argon development"
    description = "Prepares the pinned Spooklementary shader pack and Iris config for the 26.2 development client."

    doLast {
        File sourceDir = file("References/26.2/third-party/spooklementary")
        File shaderDir = new File(sourceDir, "shaders")

        if (!shaderDir.isDirectory()) {
            throw new GradleException(
                "Spooklementary reference source is not initialized. Run: git submodule update --init --recursive"
            )
        }

        String packName = "Spooklementary-2.0.4-ArgonBaseline"
        File targetDir = file("run/shaderpacks/${packName}")

        delete targetDir
        copy {
            from sourceDir
            into targetDir
            exclude ".git"
            exclude ".github"
        }

        File configDir = file("run/config")
        configDir.mkdirs()

        File irisConfig = new File(configDir, "iris.properties")
        irisConfig.setText(
            "shaderPack=${packName}\n" +
            "enableShaders=true\n" +
            "allowUnknownShaders=false\n" +
            "enableDebugOptions=false\n" +
            "disableUpdateMessage=true\n" +
            "maxShadowRenderDistance=32\n" +
            "colorSpace=SRGB\n",
            "ISO-8859-1"
        )

        logger.lifecycle("Prepared ${packName} in ${targetDir}.")
    }
}

tasks.named("runClient").configure {
    if (shaderDevStackEnabled.get()) {
        dependsOn "prepareSpooklementaryBenchmark"
    }
}

version = project.mod_version
group = project.maven_group

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
