[package]
name = "argon-probe"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Standalone low-interference performance evidence collector for Argon development"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
csv = "=1.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
