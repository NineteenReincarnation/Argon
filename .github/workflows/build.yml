name: Build

on:
    push:
        branches:
            - main
            - "mc/**"
            - "dev/**"
            - "fix/**"
    pull_request:

permissions:
    contents: read

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java 25
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "25"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Build
              run: ./gradlew build --stacktrace

            - name: Verify shader development dependency graph
              shell: bash
              run: |
                  set -euo pipefail
                  ./gradlew dependencies --configuration localRuntime -Pargon_dev_shader_stack=true > build/dev-runtime-dependencies.txt
                  grep -Fq "net.fabricmc.fabric-api:fabric-api:0.160.0+26.2" build/dev-runtime-dependencies.txt
                  grep -Fq "maven.modrinth:sodium:mc26.2-0.9.2-fabric" build/dev-runtime-dependencies.txt
                  grep -Fq "maven.modrinth:iris:1.11.4+26.2-fabric" build/dev-runtime-dependencies.txt

            - name: Verify PowerShell helper scripts
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"

                  foreach ($Path in @("scripts/run-phase0.ps1", "scripts/analyze-phase0.ps1")) {
                      $Tokens = $null
                      $Errors = $null
                      [System.Management.Automation.Language.Parser]::ParseFile(
                          $Path,
                          [ref]$Tokens,
                          [ref]$Errors
                      ) | Out-Null

                      if ($Errors.Count -gt 0) {
                          $Errors | ForEach-Object { Write-Error $_.Message }
                          throw "PowerShell syntax validation failed for $Path"
                      }
                  }

                  New-Item -ItemType Directory -Force -Path build | Out-Null
                  @'
                  timestamp_utc,pipeline_generation,argon_version,minecraft_version,iris_version,sodium_version,frames,uniforms,programs,evaluations_per_frame,changed_percent,stable_percent,pass_pushes_per_frame,actual_upload_checks_per_frame,actual_uploads_per_frame,simulated_upload_checks_per_frame,simulated_required_per_frame,simulated_avoidable_per_frame,simulated_skip_percent,instrumented_update_us_per_frame,instrumented_push_us_per_frame
                  "2026-09-18T00:00:00Z",1,"0.1.0-dev","26.2","1.11.4+mc26.2","0.9.2+mc26.2",100,30,12,30,20,80,10,40,40,40,10,30,75,25,50
                  '@ | Set-Content -Path build/phase0-fixture.csv -Encoding UTF8

                  .\scripts\analyze-phase0.ps1 -CsvPath build/phase0-fixture.csv |
                      Tee-Object -FilePath build/phase0-analysis-fixture.txt

                  $Output = Get-Content build/phase0-analysis-fixture.txt -Raw
                  if (-not $Output.Contains("Simulated skip ratio:           75.000%")) {
                      throw "Phase 0 analyzer fixture produced an unexpected skip ratio."
                  }

            - name: Verify packaged JAR
              shell: bash
              run: |
                  set -euo pipefail
                  JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
                  test -n "$JAR"
                  echo "Verifying $JAR"

                  jar tf "$JAR" > build/argon-jar-contents.txt

                  grep -Fxq "fabric.mod.json" build/argon-jar-contents.txt
                  grep -Fxq "argon.client.mixins.json" build/argon-jar-contents.txt
                  grep -Fxq "io/github/nineteenreincarnation/argon/Argon.class" build/argon-jar-contents.txt
                  grep -Fxq "io/github/nineteenreincarnation/argon/client/ArgonClient.class" build/argon-jar-contents.txt
                  grep -Fxq "io/github/nineteenreincarnation/argon/version/mc26_2/Argon26_2MixinPlugin.class" build/argon-jar-contents.txt
                  grep -Fxq "io/github/nineteenreincarnation/argon/mixin/mc26_2/iris/CustomUniformsMixin.class" build/argon-jar-contents.txt

            - name: Upload development JAR
              uses: actions/upload-artifact@v4
              with:
                  name: argon-${{ github.sha }}
                  path: |
                      build/libs/*.jar
                      !build/libs/*-sources.jar
                  if-no-files-found: error

    iris-26_2-structure:
        name: Iris ${{ matrix.runtime }} structure
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - artifact: "1.11.0+26.2-fabric"
                      runtime: "1.11.0+mc26.2"
                      sodium: "0.9.0"
                    - artifact: "1.11.1+26.2-fabric"
                      runtime: "1.11.1+mc26.2"
                      sodium: "0.9.0"
                    - artifact: "1.11.2+26.2-fabric"
                      runtime: "1.11.2+mc26.2"
                      sodium: "0.9.1"
                    - artifact: "1.11.4+26.2-fabric"
                      runtime: "1.11.4+mc26.2"
                      sodium: "0.9.2"

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java 25
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "25"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Resolve Iris release
              run: ./gradlew resolveIrisCompatibilityProbe -Piris_probe_version='${{ matrix.artifact }}' --stacktrace

            - name: Verify Iris runtime metadata
              shell: bash
              env:
                  EXPECTED_RUNTIME: "${{ matrix.runtime }}"
              run: |
                  set -euo pipefail
                  JAR="build/compatibility/iris/iris-probe.jar"
                  test -f "$JAR"
                  unzip -p "$JAR" fabric.mod.json > build/compatibility/iris/fabric.mod.json
                  python - <<'PY'
                  import json
                  import os

                  with open("build/compatibility/iris/fabric.mod.json", encoding="utf-8") as fh:
                      metadata = json.load(fh)

                  expected = os.environ["EXPECTED_RUNTIME"]
                  actual = metadata["version"]
                  if actual != expected:
                      raise SystemExit(f"Expected Iris runtime version {expected!r}, got {actual!r}")
                  print(f"Iris runtime version: {actual}")
                  PY

            - name: Verify Argon Mixin target surface
              shell: bash
              run: |
                  set -euo pipefail
                  JAR="build/compatibility/iris/iris-probe.jar"
                  OUT="build/compatibility/iris/javap"
                  mkdir -p "$OUT"

                  javap -private -classpath "$JAR" net.irisshaders.iris.pipeline.IrisRenderingPipeline > "$OUT/pipeline.txt"
                  javap -private -classpath "$JAR" net.irisshaders.iris.uniforms.custom.CustomUniforms > "$OUT/custom-uniforms.txt"
                  javap -private -classpath "$JAR" net.irisshaders.iris.uniforms.custom.cached.CachedUniform > "$OUT/cached-uniform.txt"

                  grep -Fq "void beginLevelRendering();" "$OUT/pipeline.txt"

                  grep -Fq "locationMap;" "$OUT/custom-uniforms.txt"
                  grep -Fq "void update();" "$OUT/custom-uniforms.txt"
                  grep -Fq "void push(java.lang.Object);" "$OUT/custom-uniforms.txt"
                  grep -Fq "void optimise();" "$OUT/custom-uniforms.txt"
                  grep -Fq "void mapholderToPass(" "$OUT/custom-uniforms.txt"

                  grep -Fq "boolean changed;" "$OUT/cached-uniform.txt"
                  grep -Fq "void update();" "$OUT/cached-uniform.txt"
                  grep -Fq "void pushIfChanged(int);" "$OUT/cached-uniform.txt"

                  for TYPE in FloatCachedUniform IntCachedUniform BooleanCachedUniform VectorCachedUniform; do
                      javap -private -classpath "$JAR" "net.irisshaders.iris.uniforms.custom.cached.$TYPE" > "$OUT/$TYPE.txt"
                      grep -Fq "boolean doUpdate();" "$OUT/$TYPE.txt"
                  done

                  echo "Iris ${{ matrix.runtime }} matches the current Argon Phase 0 Mixin target surface."
