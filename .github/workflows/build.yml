name: Build

on:
    push:
        branches:
            - main
            - "mc/**"
            - "dev/**"
            - "fix/**"
    pull_request:

permissions:
    contents: read

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java 25
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "25"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Build
              run: ./gradlew build --stacktrace

            - name: Verify packaged JAR
              shell: bash
              run: |
                  set -euo pipefail
                  JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
                  test -n "$JAR"
                  echo "Verifying $JAR"

                  jar tf "$JAR" > build/argon-jar-contents.txt

                  grep -Fxq "fabric.mod.json" build/argon-jar-contents.txt
                  grep -Fxq "argon.client.mixins.json" build/argon-jar-contents.txt
                  grep -Fxq "io/github/nineteenreincarnation/argon/Argon.class" build/argon-jar-contents.txt
                  grep -Fxq "io/github/nineteenreincarnation/argon/client/ArgonClient.class" build/argon-jar-contents.txt
                  grep -Fxq "io/github/nineteenreincarnation/argon/version/mc26_2/Argon26_2MixinPlugin.class" build/argon-jar-contents.txt
                  grep -Fxq "io/github/nineteenreincarnation/argon/mixin/mc26_2/iris/CustomUniformsMixin.class" build/argon-jar-contents.txt

            - name: Upload development JAR
              uses: actions/upload-artifact@v4
              with:
                  name: argon-${{ github.sha }}
                  path: |
                      build/libs/*.jar
                      !build/libs/*-sources.jar
                  if-no-files-found: error
